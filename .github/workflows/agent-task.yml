name: Agent Task

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  implement:
    if: startsWith(github.event.issue.title, '[AGENT]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create task branch
        env:
          BRANCH: agent/issue-${{ github.event.issue.number }}
        run: |
          git checkout -b "$BRANCH"

      - name: Materialize TASK.md from issue
        run: |
          mkdir -p .agent-loop
          jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH" > .agent-loop/TASK.md

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run Cursor coder
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          TASK="$(cat .agent-loop/TASK.md)"
          agent -p "$TASK

          You are the CODER in a bounded autonomous AgenturOS workflow.
          Read AGENTS.md before changing anything.
          Work only inside the task scope and allowed paths.
          Do not merge, deploy, change secrets, use paid external services, or touch production data.
          Do not run git or gh commands. Git publication is handled deterministically after you finish.
          Implement the task, add or update relevant regression tests, and run useful local checks.
          Stop only when the task is implemented or you have a concrete human blocker." --output-format text

      - name: Deterministic validation
        run: |
          npm run test:inbound
          npx tsc --noEmit
          npm run lint
          npm run build

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: agent/issue-${{ github.event.issue.number }}
        run: |
          git config user.name "AgenturOS Agent"
          git config user.email "agent@users.noreply.github.com"
          git add -A
          git commit -m "agent: implement issue #${{ github.event.issue.number }}"
          git push origin "$BRANCH"

      - name: Open draft PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: agent/issue-${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          PR_URL=$(gh pr create \
            --base master \
            --head "$BRANCH" \
            --draft \
            --title "${ISSUE_TITLE#\[AGENT\] }" \
            --body "Autonomous implementation for #${{ github.event.issue.number }}.\n\nCI and independent review must pass. No auto-merge.")
          gh issue comment "${{ github.event.issue.number }}" --body "Agent implementation complete: $PR_URL"

      - name: Comment when no changes
        if: steps.changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Agent finished without repository changes. Review the task/blocker before retrying."
