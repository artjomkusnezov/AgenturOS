name: Agent Task

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  implement:
    if: >-
      startsWith(github.event.issue.title, '[AGENT]') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create task branch
        env:
          BRANCH: agent/issue-${{ github.event.issue.number }}
        run: |
          git checkout -b "$BRANCH"

      - name: Materialize TASK.md from issue
        run: |
          mkdir -p .agent-loop
          jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH" > .agent-loop/TASK.md

      - name: Validate task contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          text = Path('.agent-loop/TASK.md').read_text(errors='replace')
          required = [
              'STATUS: READY',
              '## Goal',
              '## Acceptance criteria',
              '## Allowed paths',
              '## Out of scope',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              print('Invalid task contract. Missing: ' + ', '.join(missing))
              sys.exit(1)
          PY

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run Cursor coder
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          TASK="$(cat .agent-loop/TASK.md)"
          agent --trust -p "$TASK

          You are the CODER in a bounded autonomous AgenturOS workflow.
          Read AGENTS.md before changing anything.
          Work only inside the task scope and allowed paths.
          Do not merge, deploy, change secrets, use paid external services, or touch production data.
          Do not run git or gh commands. Git publication is handled deterministically after you finish.
          Implement the task, add or update relevant regression tests, and run useful local checks.
          Stop only when the task is implemented or you have a concrete human blocker." --output-format text

      - name: Enforce allowed paths
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import subprocess, sys

          text = Path('.agent-loop/TASK.md').read_text(errors='replace').splitlines()
          allowed = []
          in_allowed = False
          for raw in text:
              line = raw.strip()
              if line == '## Allowed paths':
                  in_allowed = True
                  continue
              if in_allowed and line.startswith('## '):
                  break
              if in_allowed and line.startswith('- '):
                  value = line[2:].strip().strip('`')
                  if value:
                      allowed.append(value)

          if not allowed:
              print('No allowed paths declared.')
              sys.exit(1)

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines()
          changed += subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines()
          changed = sorted(set(changed))

          # TASK.md is materialized deterministically by the workflow itself.
          workflow_owned = {'.agent-loop/TASK.md'}

          def matches(path: str, rule: str) -> bool:
              rule = rule.rstrip('/')
              if rule.endswith('/**'):
                  rule = rule[:-3].rstrip('/')
              return path == rule or path.startswith(rule + '/')

          violations = []
          for path in changed:
              if path in workflow_owned:
                  continue
              if not any(matches(path, rule) for rule in allowed):
                  violations.append(path)

          if violations:
              print('Changed files outside Allowed paths:')
              for path in violations:
                  print(' - ' + path)
              sys.exit(1)
          PY

      - name: Deterministic validation
        run: |
          npm run test:inbound
          npx tsc --noEmit
          npm run lint
          npm run build

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: agent/issue-${{ github.event.issue.number }}
        run: |
          git config user.name "AgenturOS Agent"
          git config user.email "agent@users.noreply.github.com"
          git add -A
          git commit -m "agent: implement issue #${{ github.event.issue.number }}"
          git push origin "$BRANCH"

      - name: Open draft PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: agent/issue-${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          PR_URL=$(gh pr create \
            --base master \
            --head "$BRANCH" \
            --draft \
            --title "${ISSUE_TITLE#\[AGENT\] }" \
            --body "Autonomous implementation for #${{ github.event.issue.number }}.\n\nCI and independent review must pass. No auto-merge.")
          gh issue comment "${{ github.event.issue.number }}" --body "Agent implementation complete: $PR_URL"

      - name: Comment when no changes
        if: steps.changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Agent finished without repository changes. Review the task/blocker before retrying."

      - name: Comment on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Agent run failed. Inspect: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
