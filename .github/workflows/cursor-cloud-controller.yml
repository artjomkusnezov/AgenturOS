name: Cursor Cloud Controller v2

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  pull_request:
    branches:
      - "master"
    types: [opened, reopened, synchronize]
  push:
    branches:
      - "controller/cursor-cloud-v1"
    paths:
      - ".cursor-controller/TRIGGER.md"

permissions:
  contents: write

concurrency:
  group: cursor-cloud-controller-agenturos
  cancel-in-progress: false

jobs:
  monitor-and-launch:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'cursor/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout controller state
        uses: actions/checkout@v4
        with:
          ref: controller/cursor-cloud-v1
          fetch-depth: 0

      - name: Preflight
        shell: bash
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${CURSOR_API_KEY:-}" || { echo "REFUSED: CURSOR_API_KEY is unavailable"; exit 2; }
          test -f .cursor-controller/TASK.md || { echo "REFUSED: TASK.md is missing"; exit 3; }

      - name: Check active agent and select next READY task
        id: select
        shell: bash
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          MAX_CHECKS=1
          CHECK_DELAY=30
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            MAX_CHECKS=30
          fi
          for ATTEMPT in $(seq 1 "$MAX_CHECKS"); do
            RESPONSE=$(curl --silent --show-error --fail --url 'https://api.cursor.com/v1/agents?limit=100' --user "${CURSOR_API_KEY}:")
            ACTIVE_ID=""
            ACTIVE_IDS=$(printf '%s' "$RESPONSE" | jq -r '.items[]? | select(.status == "ACTIVE") | .id')
            for ID in $ACTIVE_IDS; do
              DETAIL=$(curl --silent --show-error --fail --url "https://api.cursor.com/v1/agents/${ID}" --user "${CURSOR_API_KEY}:")
              if printf '%s' "$DETAIL" | jq -e '.repos[]? | select(.url == "https://github.com/artjomkusnezov/AgenturOS")' >/dev/null; then
                ACTIVE_ID="$ID"
                break
              fi
            done
            if [ -z "$ACTIVE_ID" ]; then
              break
            fi
            if [ "$ATTEMPT" -eq "$MAX_CHECKS" ]; then
              echo "active=true" >> "$GITHUB_OUTPUT"
              echo "ACTIVE: ${ACTIVE_ID}; no second agent will be launched." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Cursor agent ${ACTIVE_ID} is still finishing; check ${ATTEMPT}/${MAX_CHECKS}. Waiting ${CHECK_DELAY}s."
            sleep "$CHECK_DELAY"
          done

          TASK_FILE=""
          for CANDIDATE in .cursor-controller/TASK.md $(find .cursor-controller/queue -maxdepth 1 -type f -name '*.md' 2>/dev/null | sort); do
            if grep -Eq '^STATUS:[[:space:]]+READY[[:space:]]*$' "$CANDIDATE"; then
              TASK_FILE="$CANDIDATE"
              break
            fi
          done
          if [ -z "$TASK_FILE" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "IDLE: no READY task in the controller queue." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "active=false" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "task_file=$TASK_FILE" >> "$GITHUB_OUTPUT"

      - name: Start exactly one Cursor Cloud Agent
        id: launch
        if: steps.select.outputs.active != 'true' && steps.select.outputs.ready == 'true'
        shell: bash
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          TASK_FILE: ${{ steps.select.outputs.task_file }}
        run: |
          set -euo pipefail
          TASK=$(cat "$TASK_FILE")
          STARTING_REF=$(sed -nE 's/^STARTING_REF:[[:space:]]+(.+)$/\1/p' "$TASK_FILE" | head -n 1)
          if [ "$STARTING_REF" = "AUTO_LATEST_CURSOR" ]; then
            git fetch origin '+refs/heads/cursor/*:refs/remotes/origin/cursor/*'
            STARTING_REF=$(git for-each-ref --sort=-committerdate --format='%(refname:short)' refs/remotes/origin/cursor/ | head -n 1 | sed 's#^origin/##')
          fi
          test -n "$STARTING_REF" || { echo "REFUSED: no STARTING_REF"; exit 5; }
          SAFETY='\n\nController safety: Work only on the new Cursor-created branch. Never write main, merge, deploy, change production data, inspect/expose secrets, rewrite history, force-push, reset/clean user work, or self-assign another task. Read AGENTS.md first. Preserve provider-neutral intake and mandatory human review. Never contact customers or activate Meta/WhatsApp. Run npm run test:inbound, npx tsc --noEmit, npm run lint and npm run build once.'
          PAYLOAD=$(jq -n --arg prompt "${TASK}${SAFETY}" --arg starting_ref "$STARTING_REF" '{name:"AgenturOS Controller Task",prompt:{text:$prompt},repos:[{url:"https://github.com/artjomkusnezov/AgenturOS",startingRef:$starting_ref}],workOnCurrentBranch:false,autoCreatePR:true,skipReviewerRequest:true,mode:"agent"}')
          RESPONSE=$(curl --silent --show-error --fail-with-body --request POST --url 'https://api.cursor.com/v1/agents' --user "${CURSOR_API_KEY}:" --header 'Content-Type: application/json' --data "$PAYLOAD")
          AGENT_ID=$(printf '%s' "$RESPONSE" | jq -r '.agent.id')
          RUN_ID=$(printf '%s' "$RESPONSE" | jq -r '.run.id')
          RUN_STATUS=$(printf '%s' "$RESPONSE" | jq -r '.run.status')
          test -n "$AGENT_ID" && test "$AGENT_ID" != "null"
          echo "agent_id=$AGENT_ID" >> "$GITHUB_OUTPUT"
          echo "Launched $AGENT_ID / $RUN_ID / $RUN_STATUS from $STARTING_REF using $TASK_FILE." >> "$GITHUB_STEP_SUMMARY"

      - name: Mark queue item STARTED
        if: steps.launch.outputs.agent_id != ''
        shell: bash
        env:
          TASK_FILE: ${{ steps.select.outputs.task_file }}
          AGENT_ID: ${{ steps.launch.outputs.agent_id }}
        run: |
          set -euo pipefail
          sed -i -E 's/^STATUS:[[:space:]]+READY[[:space:]]*$/STATUS: STARTED/' "$TASK_FILE"
          {
            echo
            echo "CONTROLLER_AGENT_ID: $AGENT_ID"
            echo "CONTROLLER_STARTED_AT: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$TASK_FILE"
          git config user.name "cursor-cloud-controller"
          git config user.email "actions@users.noreply.github.com"
          git add "$TASK_FILE"
          git commit -m "controller: claim $(basename "$TASK_FILE") for $AGENT_ID"
          git push origin HEAD:controller/cursor-cloud-v1
