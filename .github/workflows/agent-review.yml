name: Agent Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Build bounded review context and prompt
        run: |
          git diff --stat origin/master...HEAD > /tmp/diff-stat.txt
          git diff origin/master...HEAD > /tmp/diff-full.txt
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/diff-full.txt').read_text(errors='replace')
          limit = 120_000
          if len(source) > limit:
              source = source[:limit] + '\n\n[DIFF TRUNCATED AT 120000 CHARACTERS — inspect repository files directly for remaining context]\n'
          Path('/tmp/diff.txt').write_text(source)
          stat = Path('/tmp/diff-stat.txt').read_text(errors='replace')
          prompt = '''You are the independent REVIEWER for AgenturOS.
Read AGENTS.md and .agent-loop/TASK.md.
Review the actual production-path diff against the task acceptance criteria, scope, regressions, security guardrails, and fake-green risk.
Do not modify files.
Do not approve because tests merely exist; verify the changed code is actually used by the user path.
Inspect repository files directly when the bounded diff is incomplete.
Run read-only inspection and tests if useful.
End with exactly one verdict line: REVIEW: PASS or REVIEW: CHANGES.
If CHANGES, provide concrete actionable findings with file paths.

Diff stat:
''' + stat + '\nBounded diff follows:\n' + source
          Path('/tmp/review-prompt.txt').write_text(prompt)
          PY

      - name: Independent review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          agent --trust --mode=ask -p "$(cat /tmp/review-prompt.txt)" --output-format text > /tmp/review.txt

      - name: Publish review
        if: always() && hashFiles('/tmp/review.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/review.txt

      - name: Enforce review verdict
        run: |
          VERDICT=$(grep -E '^REVIEW: (PASS|CHANGES)$' /tmp/review.txt | tail -n 1 || true)
          if [ "$VERDICT" != "REVIEW: PASS" ]; then
            echo "Independent review did not pass: ${VERDICT:-missing verdict}"
            exit 1
          fi
